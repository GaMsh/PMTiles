<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pmtiles.ru — отечественное зеркало PMTiles</title>
    <meta name="description" content="Отечественное зеркало проекта pmtiles.io: планетарная векторная карта Protomaps с российских серверов.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.9.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="map-page">
    <nav class="hud" aria-label="О проекте">
        <a class="hud__brand" href="./">pmtiles.ru</a>
        <a class="hud__about" href="about/">О проекте</a>
    </nav>
    <div class="lang-switch">
        <label class="lang-switch__label">
            <span class="visually-hidden">Язык данных карты</span>
            <select id="map-lang" name="lang" autocomplete="off">
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="it">Italiano</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="tr">Türkçe</option>
            </select>
        </label>
    </div>
    <div
        id="map"
        role="application"
        aria-label="Интерактивная карта"
        data-center="99.0,61.5"
        data-zoom="3"
    ></div>
    <script type="module" src="js/map.js"></script>
</body>
</html>
